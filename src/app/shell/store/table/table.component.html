<table class="table">
  <thead class="table-head">
  <tr>
    <th>
      <div class="table-head-column">
        <img class="search-column"
             src="assets/searchTableIcon.png"
             alt="иконка поиска">

        <p>Поиск</p>
      </div>
    </th>

    <th>
      <div class="table-head-column">
        <p>Автор</p>
      </div>
    </th>

    <th>
      <div class="table-head-column">
        <p>Дата создания</p>

        <img class="date-column"
             src="assets/changeTableIcon.png"
             alt="иконка прокрутки">
      </div>
    </th>

    <th>
      <div class="table-head-column">
        <p>Редактор</p>
      </div>
    </th>

    <th>
      <div class="table-head-column">
        <p>Дата редактирования</p>

        <img class="date-column"
             src="assets/changeTableIcon.png"
             alt="иконка прокрутки">
      </div>
    </th>
  </tr>
  </thead>

  <tbody>
  <ng-container *ngIf="projects">
    <tr *ngFor="let project of projects"
        class="table-body-row" (click)="onProjectClick(project)">
      <td class="table-first-column table-body-cell">{{project.name}}</td>

      <td class="table-body-cell">{{project.createdBy}}</td>

      <td class="table-body-cell">{{project.createdAt | date:'E, d MMMM, y'}}</td>

      <td class="table-body-cell">{{project.updatedBy}}</td>

      <td class="table-body-cell">{{project.updatedAt | date:'E, d MMMM, y'}}</td>
    </tr>
  </ng-container>
  </tbody>
</table>
